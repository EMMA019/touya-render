services:
  - type: web
    name: touya
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npx next start --port $PORT --hostname 0.0.0.0
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: NEXT_PUBLIC_ADS_ENABLED
        value: "1"
      - key: NODE_VERSION
        value: "20"
