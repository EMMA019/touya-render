services:
  - type: web
    name: touya
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npx next start --port $PORT --hostname 0.0.0.0
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_NSFW_MODEL
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: NEXT_PUBLIC_ADS_ENABLED
        value: "1"
      - key: NODE_VERSION
        value: "20"
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      # Optional. Comma-separated extra browser origins (custom CF domain).
      # *.pages.dev / *.workers.dev / localhost are already allowed in code.
      - key: TOUYA_CORS_ORIGINS
        sync: false
